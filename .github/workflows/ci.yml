name: CI

on:
  push:
  pull_request:

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t voice-relay:ci .
      - name: Verify zero-configuration Docker bootstrap
        run: |
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health/ready; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3100/health/ready
          docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T relay test -f /data/master.key
          docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T relay test -f /data/initial-credentials.txt
          docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T relay grep -Eq '^username=[A-Za-z0-9]{8}$' /data/initial-credentials.txt
          docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T relay grep -Eq '^password=[A-Za-z0-9]{8}$' /data/initial-credentials.txt
          ! docker port "$(docker compose -f docker-compose.yml -f docker-compose.build.yml ps -q relay)" | grep -Eq '(^|:)80$|(^|:)443$'
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml down

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore apps/windows/VoiceRelay.Windows/VoiceRelay.Windows.csproj
      - run: dotnet build apps/windows/VoiceRelay.Windows/VoiceRelay.Windows.csproj -c Release --no-restore
      - run: dotnet test apps/windows/VoiceRelay.Windows.Tests/VoiceRelay.Windows.Tests.csproj -c Release
      - run: dotnet publish apps/windows/VoiceRelay.Windows/VoiceRelay.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Verify single-file Windows publish
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/windows -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'VoiceRelay.exe') {
            throw "Expected exactly one VoiceRelay.exe publish artifact; found: $($files.Name -join ', ')"
          }
